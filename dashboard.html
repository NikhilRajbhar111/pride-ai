<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pride AI Masterclass — Registrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090F;
    --panel: #0E0E1A;
    --panel-2: #12121f;
    --border: rgba(255,255,255,0.08);
    --cyan: #00C4CC;
    --purple: #9B5DE5;
    --orange: #FF6B35;
    --green: #34d399;
    --red: #ff6b6b;
    --white: #F0F0F0;
    --muted: #7d7d95;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { color-scheme: dark; }
  body {
    background: var(--bg); color: var(--white);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }
  ::selection { background: rgba(0,196,204,0.3); }

  /* TOP BAR */
  header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(9,9,15,0.9); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px;
    color: var(--bg); background: linear-gradient(135deg, var(--cyan), var(--purple));
    width: 38px; height: 38px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .brand-text { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; }
  .brand-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }

  .header-actions { display: flex; align-items: center; gap: 10px; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 0 rgba(52,211,153,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(52,211,153,0); }
    100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
  }
  .live-label { font-size: 12px; color: var(--muted); font-family: 'Syne', sans-serif; letter-spacing: 0.5px; display: flex; align-items: center; gap: 7px; }

  .btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--white);
    font-family: 'Syne', sans-serif; font-size: 12.5px; font-weight: 700;
    letter-spacing: 0.5px; padding: 9px 16px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; gap: 7px; transition: border-color .2s, background .2s, transform .15s;
  }
  .btn:hover { border-color: var(--cyan); transform: translateY(-1px); }
  .btn.primary { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
  .btn.primary:hover { background: #33f8ff; }
  .btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
  .btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main { padding: 28px 32px 60px; max-width: 1500px; margin: 0 auto; }

  /* STATS */
  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
  }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 38px; line-height: 1; }
  .stat-label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'Syne', sans-serif; margin-top: 6px; }
  .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .stat-sub.up { color: var(--green); }

  /* FILTER BAR */
  .filter-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
  }
  .filter-field { display: flex; flex-direction: column; gap: 6px; min-width: 150px; flex: 1; }
  .filter-field.search { flex: 2; min-width: 220px; }
  .filter-field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-family: 'Syne', sans-serif; font-weight: 700; }
  .filter-field input, .filter-field select {
    background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--white);
    padding: 10px 12px; border-radius: 6px; font-size: 13.5px; font-family: 'DM Sans', sans-serif; outline: none;
    transition: border-color .2s;
  }
  .filter-field input:focus, .filter-field select:focus { border-color: var(--cyan); }
  .filter-field select option { background: #1a1a2e; }
  .filter-clear { flex: none; }
  .active-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: -6px; margin-bottom: 18px; }
  .chip {
    font-size: 11.5px; font-family: 'Syne', sans-serif; font-weight: 700;
    background: rgba(0,196,204,0.1); border: 1px solid rgba(0,196,204,0.3); color: var(--cyan);
    padding: 5px 10px; border-radius: 99px; display: flex; align-items: center; gap: 6px;
  }
  .chip button { background: none; border: none; color: var(--cyan); cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }

  /* TABLE */
  .table-wrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 900px; }
  thead th {
    text-align: left; padding: 13px 16px; font-family: 'Syne', sans-serif; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 700;
    background: var(--panel-2); border-bottom: 1px solid var(--border); white-space: nowrap;
    cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--cyan); }
  thead th .sort-arrow { opacity: 0.4; margin-left: 4px; font-size: 10px; }
  thead th.sorted .sort-arrow { opacity: 1; color: var(--cyan); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
  tbody tr:hover { background: rgba(0,196,204,0.03); }
  tbody tr:last-child { border-bottom: none; }
  td { padding: 13px 16px; white-space: nowrap; }
  td.name-cell { font-weight: 600; }
  td.muted-cell { color: var(--muted); }
  .badge {
    display: inline-block; font-size: 11px; font-family: 'Syne', sans-serif; font-weight: 700;
    padding: 4px 10px; border-radius: 99px; letter-spacing: 0.3px;
  }
  .badge.role-Student { background: rgba(0,196,204,0.12); color: var(--cyan); }
  .badge.role-Content-Creator { background: rgba(155,93,229,0.15); color: var(--purple); }
  .badge.role-Freelancer { background: rgba(255,107,53,0.14); color: var(--orange); }
  .badge.role-Business-Owner { background: rgba(52,211,153,0.14); color: var(--green); }
  .badge.role-Working-Professional { background: rgba(240,240,240,0.1); color: var(--white); }
  .badge.role-unknown { background: rgba(255,255,255,0.06); color: var(--muted); }
  .pill { font-size: 11px; color: var(--muted); font-family: 'Syne', sans-serif; }
  .pill.source-online { color: var(--cyan); }
  .pill.source-offline { color: var(--orange); }
  .pill.pay-online { color: var(--green); }
  .pill.pay-pay_in_class { color: var(--orange); }
  a.phone-link, a.mail-link { color: var(--white); text-decoration: none; border-bottom: 1px dotted var(--muted); }
  a.phone-link:hover, a.mail-link:hover { color: var(--cyan); border-color: var(--cyan); }

  .empty-state, .error-state {
    padding: 70px 20px; text-align: center; color: var(--muted);
  }
  .empty-state svg, .error-state svg { width: 44px; height: 44px; stroke: var(--muted); fill: none; stroke-width: 1.5; margin-bottom: 14px; }
  .error-state { color: var(--red); }
  .error-state svg { stroke: var(--red); }

  .loading-row { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px; color: var(--muted); }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2.5px solid var(--border); border-top-color: var(--cyan);
    animation: spin 0.7s linear infinite;
  }

  .footer-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; gap: 8px; }

  @media (max-width: 700px) {
    header { padding: 14px 16px; }
    main { padding: 18px 14px 40px; }
    .filter-field { min-width: 130px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">P</div>
    <div>
      <div class="brand-text">AI Masterclass — Registrations</div>
      <div class="brand-sub">Pride Computer Education, Goregaon</div>
    </div>
  </div>
  <div class="header-actions">
    <div class="live-label"><span class="live-dot"></span> <span id="lastSync">connecting…</span></div>
    <button class="btn" id="refreshBtn" onclick="loadData()">
      <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      Refresh
    </button>
    <button class="btn primary" onclick="exportCSV()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export CSV
    </button>
  </div>
</header>

<main>

  <div class="stats-row" id="statsRow">
    <!-- filled by JS -->
  </div>

  <div class="filter-panel">
    <div class="filter-field search">
      <label>Search</label>
      <input type="text" id="fSearch" placeholder="Name, phone or email…" oninput="applyFilters()" />
    </div>
    <div class="filter-field">
      <label>Role</label>
      <select id="fRole" onchange="applyFilters()">
        <option value="">All roles</option>
        <option>Student</option>
        <option>Content Creator</option>
        <option>Freelancer</option>
        <option>Business Owner</option>
        <option>Working Professional</option>
      </select>
    </div>
    <div class="filter-field">
      <label>Mode</label>
      <select id="fSource" onchange="applyFilters()">
        <option value="">All modes</option>
        <option value="landing_page_online">Online</option>
        <option value="landing_page_offline">Offline (in-person)</option>
      </select>
    </div>
    <div class="filter-field">
      <label>Payment</label>
      <select id="fPayment" onchange="applyFilters()">
        <option value="">All</option>
        <option value="online">Paid online</option>
        <option value="pay_in_class">Pay in class</option>
      </select>
    </div>
    <div class="filter-field">
      <label>From date</label>
      <input type="date" id="fFrom" onchange="applyFilters()" />
    </div>
    <div class="filter-field">
      <label>To date</label>
      <input type="date" id="fTo" onchange="applyFilters()" />
    </div>
    <div class="filter-field filter-clear" style="flex:none;">
      <label>&nbsp;</label>
      <button class="btn" onclick="clearFilters()">Clear</button>
    </div>
  </div>

  <div class="active-chip-row" id="chipRow"></div>

  <div class="table-wrap">
    <div class="table-scroll">
      <table id="dataTable" style="display:none;">
        <thead>
          <tr>
            <th data-key="name" onclick="sortBy('name')">Name <span class="sort-arrow">↕</span></th>
            <th data-key="phone" onclick="sortBy('phone')">Phone <span class="sort-arrow">↕</span></th>
            <th data-key="email" onclick="sortBy('email')">Email <span class="sort-arrow">↕</span></th>
            <th data-key="role" onclick="sortBy('role')">Role <span class="sort-arrow">↕</span></th>
            <th data-key="source" onclick="sortBy('source')">Mode <span class="sort-arrow">↕</span></th>
            <th data-key="payment_method" onclick="sortBy('payment_method')">Payment <span class="sort-arrow">↕</span></th>
            <th data-key="created_at" onclick="sortBy('created_at')">Registered <span class="sort-arrow">↕</span></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="loading-row" id="loadingRow">
        <div class="spinner"></div> Loading registrations…
      </div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <div>No registrations match these filters.</div>
      </div>
      <div class="error-state" id="errorState" style="display:none;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div id="errorMsg">Couldn't load data.</div>
      </div>
    </div>
    <div class="footer-row">
      <span id="rowCount">—</span>
      <span>Data pulled directly from Supabase · auto-refreshes every 60s</span>
    </div>
  </div>

</main>

<script>
  const SUPABASE_URL = "https://wdejofhyatmtrpfsqxum.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Yxz9tO6M2icV_YeEeSThiw_0MgK6EeA";

  let allRows = [];
  let filteredRows = [];
  let sortKey = 'created_at';
  let sortDir = 'desc';

  async function loadData() {
    const btn = document.getElementById('refreshBtn');
    btn.classList.add('spinning');
    document.getElementById('loadingRow').style.display = allRows.length ? 'none' : 'flex';
    document.getElementById('errorState').style.display = 'none';
    document.getElementById('dataTable').style.display = allRows.length ? 'table' : 'none';

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/registrations?select=*&order=created_at.desc`, {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      });
      if (!res.ok) throw new Error(`Request failed (${res.status})`);
      const data = await res.json();
      allRows = data;
      document.getElementById('lastSync').textContent = 'synced ' + new Date().toLocaleTimeString();
      applyFilters();
    } catch (err) {
      document.getElementById('loadingRow').style.display = 'none';
      document.getElementById('dataTable').style.display = 'none';
      document.getElementById('errorState').style.display = 'block';
      document.getElementById('errorMsg').textContent = err.message || 'Couldn\'t load data.';
      document.getElementById('lastSync').textContent = 'sync failed';
    } finally {
      btn.classList.remove('spinning');
    }
  }

  function applyFilters() {
    const search = document.getElementById('fSearch').value.trim().toLowerCase();
    const role = document.getElementById('fRole').value;
    const source = document.getElementById('fSource').value;
    const payment = document.getElementById('fPayment').value;
    const from = document.getElementById('fFrom').value;
    const to = document.getElementById('fTo').value;

    filteredRows = allRows.filter(r => {
      if (search) {
        const hay = `${r.name || ''} ${r.phone || ''} ${r.email || ''}`.toLowerCase();
        if (!hay.includes(search)) return false;
      }
      if (role && r.role !== role) return false;
      if (source && r.source !== source) return false;
      if (payment && r.payment_method !== payment) return false;
      if (from && r.created_at && r.created_at.slice(0,10) < from) return false;
      if (to && r.created_at && r.created_at.slice(0,10) > to) return false;
      return true;
    });

    renderChips({ search, role, source, payment, from, to });
    renderStats();
    sortRows();
  }

  function renderChips(f) {
    const row = document.getElementById('chipRow');
    row.innerHTML = '';
    const defs = [
      ['search', f.search, `"${f.search}"`],
      ['role', f.role, f.role],
      ['source', f.source, f.source === 'landing_page_online' ? 'Online' : 'Offline'],
      ['payment', f.payment, f.payment === 'online' ? 'Paid online' : 'Pay in class'],
      ['from', f.from, `from ${f.from}`],
      ['to', f.to, `to ${f.to}`],
    ];
    defs.forEach(([key, val, label]) => {
      if (!val) return;
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `${label} <button onclick="clearOneFilter('${key}')">×</button>`;
      row.appendChild(chip);
    });
  }

  function clearOneFilter(key) {
    const map = { search: 'fSearch', role: 'fRole', source: 'fSource', payment: 'fPayment', from: 'fFrom', to: 'fTo' };
    document.getElementById(map[key]).value = '';
    applyFilters();
  }

  function clearFilters() {
    ['fSearch','fRole','fSource','fPayment','fFrom','fTo'].forEach(id => document.getElementById(id).value = '');
    applyFilters();
  }

  function renderStats() {
    const now = new Date();
    const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startOfWeek = new Date(startOfToday); startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());

    const total = filteredRows.length;
    const today = filteredRows.filter(r => r.created_at && new Date(r.created_at) >= startOfToday).length;
    const thisWeek = filteredRows.filter(r => r.created_at && new Date(r.created_at) >= startOfWeek).length;
    const paidOnline = filteredRows.filter(r => r.payment_method === 'online').length;
    const offline = filteredRows.filter(r => r.source === 'landing_page_offline').length;
    const online = filteredRows.filter(r => r.source === 'landing_page_online').length;

    const cards = [
      { num: total, label: 'Total Registrations' },
      { num: today, label: 'Registered Today' },
      { num: thisWeek, label: 'This Week' },
      { num: online, label: 'Online Signups' },
      { num: offline, label: 'Offline Signups' },
      { num: paidOnline, label: 'Paid Online' },
    ];

    document.getElementById('statsRow').innerHTML = cards.map(c =>
      `<div class="stat-card"><div class="stat-num">${c.num}</div><div class="stat-label">${c.label}</div></div>`
    ).join('');
  }

  function sortBy(key) {
    if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    else { sortKey = key; sortDir = 'asc'; }
    sortRows();
  }

  function sortRows() {
    filteredRows.sort((a, b) => {
      let av = a[sortKey] ?? '';
      let bv = b[sortKey] ?? '';
      if (sortKey === 'created_at') { av = new Date(av || 0).getTime(); bv = new Date(bv || 0).getTime(); }
      else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
      if (av < bv) return sortDir === 'asc' ? -1 : 1;
      if (av > bv) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    document.querySelectorAll('thead th').forEach(th => {
      th.classList.toggle('sorted', th.dataset.key === sortKey);
      const arrow = th.querySelector('.sort-arrow');
      if (th.dataset.key === sortKey) arrow.textContent = sortDir === 'asc' ? '↑' : '↓';
      else arrow.textContent = '↕';
    });
    renderTable();
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) +
           ' · ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  }

  function roleClass(role) {
    return 'role-' + (role ? role.replace(/\s+/g, '-') : 'unknown');
  }

  function renderTable() {
    document.getElementById('loadingRow').style.display = 'none';
    const body = document.getElementById('tableBody');
    const table = document.getElementById('dataTable');
    const empty = document.getElementById('emptyState');

    document.getElementById('rowCount').textContent =
      `Showing ${filteredRows.length} of ${allRows.length} registration${allRows.length === 1 ? '' : 's'}`;

    if (!filteredRows.length) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';
    table.style.display = 'table';

    body.innerHTML = filteredRows.map(r => {
      const sourceLabel = r.source === 'landing_page_offline' ? 'Offline' : r.source === 'landing_page_online' ? 'Online' : (r.source || '—');
      const sourceClass = r.source === 'landing_page_offline' ? 'source-offline' : r.source === 'landing_page_online' ? 'source-online' : '';
      const payLabel = r.payment_method === 'pay_in_class' ? 'Pay in class' : r.payment_method === 'online' ? 'Paid online' : '—';
      const payClass = r.payment_method ? 'pay-' + r.payment_method : '';
      return `
        <tr>
          <td class="name-cell">${escapeHtml(r.name || '—')}</td>
          <td>${r.phone ? `<a class="phone-link" href="tel:${escapeHtml(r.phone)}">${escapeHtml(r.phone)}</a>` : '—'}</td>
          <td>${r.email ? `<a class="mail-link" href="mailto:${escapeHtml(r.email)}">${escapeHtml(r.email)}</a>` : '—'}</td>
          <td><span class="badge ${roleClass(r.role)}">${escapeHtml(r.role || 'Unknown')}</span></td>
          <td><span class="pill ${sourceClass}">${sourceLabel}</span></td>
          <td><span class="pill ${payClass}">${payLabel}</span></td>
          <td class="muted-cell">${fmtDate(r.created_at)}</td>
        </tr>`;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }

  function exportCSV() {
    if (!filteredRows.length) return;
    const headers = ['Name','Phone','Email','Role','Mode','Payment','Registered At'];
    const lines = [headers.join(',')];
    filteredRows.forEach(r => {
      const row = [
        r.name || '', r.phone || '', r.email || '', r.role || '',
        r.source || '', r.payment_method || '', r.created_at || ''
      ].map(v => `"${String(v).replace(/"/g, '""')}"`);
      lines.push(row.join(','));
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pride-ai-registrations-${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  loadData();
  setInterval(loadData, 60000);
</script>
</body>
</html>
